{{template "head" "Something went wrong"}}
{{template "topbar" .}}
<main class="mx-auto flex max-w-5xl justify-center px-4 py-16">
  <div class="card flex w-full max-w-md flex-col gap-3 p-8">
    <h1 class="text-xl font-semibold">{{if eq .Status 404}}Not found{{else if eq .Status 403}}Not for you{{else}}That didn't work{{end}}</h1>
    <p class="text-muted">{{.Message}}</p>
    <div><a class="btn btn-outline mt-2" href="/">Back to the start</a></div>
  </div>
</main>
{{template "foot"}}
